name: CI

# Every job runs on every change: app and server share the protocol, and
# required status checks must never be skipped.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The shared rules engine: one test per rule in docs/reglas.md.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parchis_core
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Warnings and errors fail the build; style infos are reported only.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  firestore:
    # Security rules + server transactions against the Firestore emulator
    # (demo project: never touches production).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g firebase-tools@15
      - run: npm ci --prefix firebase/rules-test
      - run: dart pub get
      - run: >
          firebase emulators:exec --only firestore --project demo-parchis
          "npm --prefix firebase/rules-test test && dart test test/integration"

  docker:
    # The production image builds, starts, and carries no credentials.
    # Built from the repository root: the server depends on packages/.
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v5
      - name: Plant a fake credential that must not end up in the image
        run: echo '{"canary":true}' > server/service_account.json
      - run: docker build -f server/Dockerfile -t parchis-server .
      - name: Image contains no service account
        run: |
          docker create --name probe parchis-server
          if docker export probe | tar -t | grep -i service_account; then
            echo "service_account.json leaked into the image"; exit 1
          fi
      - name: Container serves /health
        run: |
          docker run -d -p 8080:8080 -e PARCHIS_DEV_AUTH_BYPASS=true --name srv parchis-server
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs srv
          exit 1

  stress-e2e:
    # One real server (no Firebase credentials, test mode allowed), then:
    # concurrent rooms + hostile clients + leak check, and the app's socket
    # client and game controller playing a match against it.
    runs-on: ubuntu-latest
    needs: [server, app]
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - name: Build and start server
        working-directory: server
        run: |
          dart pub get
          dart pub global activate dart_frog_cli
          dart pub global run dart_frog_cli:dart_frog build
          cd build && dart pub get
          PARCHIS_DEV_AUTH_BYPASS=true PARCHIS_ALLOW_TEST_MODE=true \
            dart bin/server.dart > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/server.log"
          exit 1
      - name: Stress test
        working-directory: server
        run: dart run tool/stress_test.dart ws://localhost:8080/ws 4 --quick
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - name: App end-to-end match
        working-directory: app
        run: |
          flutter pub get
          flutter test test/e2e
        env:
          PARCHIS_E2E_URL: ws://localhost:8080/ws
      - name: Server log
        if: always()
        run: cat server.log

  android:
    # The Android project compiles (Gradle, Kotlin, plugins). Debug build
    # only: nothing is signed or published.
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - uses: ./.github/actions/android-ndk
      - run: flutter pub get
      - run: flutter build apk --debug
