name: CI

on:
  push:
    branches: [Jorge, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Warnings and errors fail the build; style infos are reported only.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  e2e:
    # The app's socket client and game controller play a match against the
    # real server: catches protocol drift between the two repos. Uses the
    # server branch with the same name as this one when it exists, else main.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Pick server branch
        id: server
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/jorge150302/parchis_server.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: jorge150302/parchis_server
          ref: ${{ steps.server.outputs.ref }}
          path: server
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - name: Build and start server (no Firebase credentials, test mode allowed)
        working-directory: server
        run: |
          dart pub get
          dart pub global activate dart_frog_cli
          dart pub global run dart_frog_cli:dart_frog build
          cd build && dart pub get
          PARCHIS_DEV_AUTH_BYPASS=true PARCHIS_ALLOW_TEST_MODE=true \
            dart bin/server.dart > ../../server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          cat ../../server.log
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/e2e
        env:
          PARCHIS_E2E_URL: ws://localhost:8080/ws
      - name: Server log
        if: always()
        run: cat server.log

  android:
    # The Android project compiles (Gradle, Kotlin, plugins). Debug build
    # only: nothing is signed or published.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
